# Services locaux de développement uniquement (jamais en production).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qsd
      POSTGRES_PASSWORD: qsd
      POSTGRES_DB: qsd_dev
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
